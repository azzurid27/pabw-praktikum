<section id="bagian-2">
  <h2>Judul bagian kedua</h2>
  <form action="/simpan" method="post">
    <p>
      <label for="nama-kolom">Keterangan kolom</label>
      <input type="text" id="nama-kolom" name="nama-kolom" required>
    </p>
    <p>
      <label for="email-pengguna">Alamat Email</label>
      <input type="email" id="email-pengguna" name="email-pengguna" required>
    </p>
    <p>
      <label for="umur-pengguna">Umur (Minimal 17)</label>
      <input type="number" id="umur-pengguna" name="umur-pengguna" min="17" required>
    </p>
    <button type="submit">Simpan</button>
  </form>
</section>
